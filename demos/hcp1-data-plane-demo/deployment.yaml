apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcade-demo
  labels:
    app.kubernetes.io/name: arcade-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arcade-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arcade-demo
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.25-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: html
          configMap:
            name: arcade-demo-html
