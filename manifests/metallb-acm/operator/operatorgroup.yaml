apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: metallb-operator
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
# Omit spec.targetNamespaces: MetalLB 4.11+ CSV is AllNamespaces-only; targetNamespaces
# makes OLM use OwnNamespace ("OwnNamespace InstallModeType not supported").
spec:
  upgradeStrategy: Default
