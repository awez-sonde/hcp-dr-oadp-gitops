# HyperShift hosted clusters use HostNetwork for the default IngressController; the
# operator does not create a LoadBalancer Service. Expose apps ingress via MetalLB:
# https://hypershift.pages.dev/recipes/common/exposing-dataplane-with-metallb/
#
# Apply after MetalLB operator + hcp1-apps-pool are ready. Point *.apps.hcp1.<baseDomain>
# DNS at status.loadBalancer.ingress[0].ip (e.g. 192.168.122.21).
apiVersion: v1
kind: Service
metadata:
  name: metallb-ingress
  namespace: openshift-ingress
  annotations:
    metallb.io/address-pool: hcp1-apps-pool
    metallb.io/loadBalancerIPs: 192.168.122.21
spec:
  type: LoadBalancer
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
  selector:
    ingresscontroller.operator.openshift.io/deployment-ingresscontroller: default
