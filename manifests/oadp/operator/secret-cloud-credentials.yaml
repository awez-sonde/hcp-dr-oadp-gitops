# POC / lab only: cleartext MinIO credentials in Git. Do not reuse this pattern outside throwaway environments.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials-velero
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id=minioadmin
    aws_secret_access_key=redhat123
