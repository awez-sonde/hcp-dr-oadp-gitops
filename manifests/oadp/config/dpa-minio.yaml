# MinIO S3-compatible backup store (reference lab VM on libvirt default network).
# Aligned with OADP 1.5+ HyperShift DR guidance (hypershift + CSI plugins, snapshot upload).
# See: https://hypershift.pages.dev/how-to/disaster-recovery/backup-and-restore-oadp-1-5/
# Bucket must exist (e.g. mc mb minio/velero).
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: dpa-minio
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  logFormat: text
  backupLocations:
    - velero:
        provider: aws
        default: true
        credential:
          name: cloud-credentials-velero
          key: cloud
        objectStorage:
          bucket: velero
          prefix: hcp-dr
        config:
          region: minio
          profile: "default"
          s3Url: http://192.168.122.8:9000
          s3ForcePathStyle: "true"
  snapshotLocations:
    - velero:
        provider: aws
        config:
          region: minio
          profile: "default"
        credential:
          key: cloud
          name: cloud-credentials-velero
  configuration:
    velero:
      defaultPlugins:
        - openshift
        - aws
        - csi
        - hypershift
      disableFsBackup: false
      featureFlags:
        - EnableCSI
      resourceTimeout: 2h
    nodeAgent:
      enable: true
      uploaderType: kopia
