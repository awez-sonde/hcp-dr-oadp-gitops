# MinIO S3-compatible backup store (reference lab VM on libvirt default network).
# Bucket must exist (e.g. mc mb minio/velero). Region/profile values satisfy the AWS plugin.
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: dpa-minio
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  # OADP 1.5 reconciles these defaults; keep them in Git so Argo stays Synced.
  logFormat: text
  configuration:
    velero:
      defaultPlugins:
        - openshift
        - aws
      disableFsBackup: false
      featureFlags:
        - EnableCSI
    nodeAgent:
      enable: false
      uploaderType: kopia
  backupLocations:
    - velero:
        provider: aws
        default: true
        credential:
          name: cloud-credentials-velero
          key: cloud
        objectStorage:
          bucket: velero
          prefix: hcp-dr
        config:
          region: minio
          profile: "default"
          s3Url: http://192.168.122.8:9000
          s3ForcePathStyle: "true"
