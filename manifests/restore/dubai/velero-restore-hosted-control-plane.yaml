# Velero Restore — hosted control plane (Dubai management cluster).
#
# Before syncing in Argo: set spec.backupName to a Velero backup that exists on this cluster
# (synced from S3). Example: oc get backup.velero.io -n openshift-adp
#
# After Velero completes, continue with HyperShift restore / validation per your version’s DR doc:
# https://hypershift.pages.dev/how-to/disaster-recovery/backup-and-restore-oadp-1-5/
#
# If you need to re-run: delete this Restore object first, then change metadata.name or use a new name.
---
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: hcp-dr-restore-hcp1-velero-once
  namespace: openshift-adp
  labels:
    hcp-dr-gitops.lab/component: hosted-control-plane
    hcp-dr-gitops.lab/site: dubai-ocp
spec:
  backupName: hcp-control-plane-gitops-20260514070026
  excludedResources:
    - nodes
    - events
    - events.events.k8s.io
    - backups.velero.io
    - restores.velero.io
    - resticrepositories.velero.io
