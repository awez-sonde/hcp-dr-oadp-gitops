# One-shot Job: fix NFS/PVC ownership on etcd data volumes after Velero restore so etcd
# (runAsUser/fsGroup 1000890000) can read /var/lib/data. Apply on the management cluster
# in namespace hcp1-hcp1, then restart etcd pods.
#
#   oc apply -k manifests/hcp1-etcd-nfs-perm-fix/
#   oc wait --for=condition=complete job/etcd-data-chown -n hcp1-hcp1 --timeout=300s
#   oc delete pod -n hcp1-hcp1 -l app=etcd
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-data-chown
  namespace: hcp1-hcp1
