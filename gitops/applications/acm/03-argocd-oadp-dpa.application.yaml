# Apply after hcp-dr-oadp-operator is Synced and the OADP CSV is Succeeded (CRDs exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hcp-dr-oadp-dpa
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/awez-sonde/hcp-dr-oadp-gitops.git
    targetRevision: main
    path: manifests/oadp/config
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-adp
  ignoreDifferences:
    # Argo CD injects tracking-id on live objects; Git will never contain it — ignore or the app stays OutOfSync.
    - group: oadp.openshift.io
      kind: DataProtectionApplication
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 30
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      # DPA strategic-merge patches can fail validation when toggling nodeAgent; replace applies full spec from Git.
      - Replace=true
