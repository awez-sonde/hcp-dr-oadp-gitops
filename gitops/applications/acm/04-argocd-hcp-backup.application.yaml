# Velero Schedule for HyperShift hosted control plane backups (after hcp-dr-oadp-dpa is Synced).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hcp-dr-hcp-backup
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/awez-sonde/hcp-dr-oadp-gitops.git
    targetRevision: main
    path: manifests/hcp-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-adp
  ignoreDifferences:
    - group: velero.io
      kind: Schedule
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
