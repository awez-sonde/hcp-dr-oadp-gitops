---
# Broad lab permissions for Argo CD application-controller to install OADP and
# reconcile Velero / HyperShift APIs. Tighten for production (principle of least privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-hcp-dr-gitops
rules:
  - apiGroups: ["hypershift.openshift.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["scheduling.hypershift.openshift.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["oadp.openshift.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions", "installplans", "operatorgroups"]
    verbs: ["*"]
  - apiGroups: ["packages.operators.coreos.com"]
    resources: ["packagemanifests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps", "batch", "extensions"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["machine.openshift.io", "operator.openshift.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metallb.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["frrk8s.metallb.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-hcp-dr-gitops-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-hcp-dr-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
