global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats
    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-server-ciphers PROFILE=SYSTEM

defaults
    log                     global
    option                  dontlognull
    option                  redispatch
    retries                 3
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout check           10s
    maxconn                 3000

# ─── OpenShift API (port 6443) — SNI routing ───
frontend api-server
    bind *:6443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend api-acm-be  if { req.ssl_sni -i api.acm.awezlab.local }
    use_backend api-dubai-ocp-be if { req.ssl_sni -i api.dubai-ocp.awezlab.local }
    use_backend api-abudhabi-ocp-be if { req.ssl_sni -i api.abudhabi-ocp.awezlab.local }
    use_backend api-hcp1-be if { req.ssl_sni -i api.hcp1.awezlab.local }
    use_backend api-hcp2-be if { req.ssl_sni -i api.hcp2.awezlab.local }
    default_backend api-ocpv-be

backend api-ocpv-be
    mode tcp
    balance source
    server api-vip 192.168.150.200:6443 check

backend api-acm-be
    mode tcp
    balance source
    server api-acm 192.168.122.253:6443 check

backend api-dubai-ocp-be
    mode tcp
    balance source
    server api-dubai-ocp 192.168.122.252:6443 check

backend api-abudhabi-ocp-be
    mode tcp
    balance source
    server api-abudhabi-ocp 192.168.122.251:6443 check

# hcp1 API: after Velero restore on Dubai, kube-apiserver LoadBalancer (MetalLB dubai-hcp-api-pool)
backend api-hcp1-be
    mode tcp
    balance source
    server api-hcp1 192.168.122.31:6443 check

backend api-hcp2-be
    mode tcp
    balance source
    server api-hcp2 192.168.122.12:6443 check


# ─── OpenShift HTTPS / Console (port 443) — SNI routing ───
frontend https-ingress
    bind *:443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend https-acm-be if { req.ssl_sni -m end .apps.acm.awezlab.local }
    use_backend https-dubai-ocp-be if { req.ssl_sni -m end .apps.dubai-ocp.awezlab.local }
    use_backend https-abudhabi-ocp-be if { req.ssl_sni -m end .apps.abudhabi-ocp.awezlab.local }
    use_backend https-hcp1-be if { req.ssl_sni -m end .apps.hcp1.awezlab.local }
    use_backend https-hcp2-be if { req.ssl_sni -m end .apps.hcp2.awezlab.local }
    # MinIO: TLS passthrough to the VM (enable HTTPS on MinIO for these SNIs, or use :9000/:9001 / :80 below)
    use_backend minio-console-tls-be if { req.ssl_sni -i console.minio.awezlab.local }
    use_backend minio-s3-tls-be if { req.ssl_sni -i s3.minio.awezlab.local }
    default_backend https-ocpv-be

backend https-ocpv-be
    mode tcp
    balance source
    server worker1 192.168.150.81:443 check
    server worker2 192.168.150.84:443 check

backend https-acm-be
    mode tcp
    balance source
    server acm-ingress 192.168.122.253:443 check

backend https-dubai-ocp-be
    mode tcp
    balance source
    server dubai-ocp-ingress 192.168.122.252:443 check

backend https-abudhabi-ocp-be
    mode tcp
    balance source
    server abudhabi-ocp-ingress 192.168.122.251:443 check

# Hosted data-plane ingress for *.apps.hcp1.awezlab.local (workers). Change if your ingress VIP moved.
backend https-hcp1-be
    mode tcp
    balance source
    server hcp1-ingress 192.168.122.21:443 check

backend https-hcp2-be
    mode tcp
    balance source
    server hcp2-ingress 192.168.122.22:443 check

backend minio-s3-tls-be
    mode tcp
    balance source
    server minio-s3 192.168.122.8:9000 check

backend minio-console-tls-be
    mode tcp
    balance source
    server minio-console 192.168.122.8:9001 check


# ─── MinIO (HTTP today) — published ports for external access ───
frontend minio-s3-tcp
    bind *:9000
    mode tcp
    option tcplog
    default_backend minio-s3-plain-be

frontend minio-console-tcp
    bind *:9001
    mode tcp
    option tcplog
    default_backend minio-console-plain-be

backend minio-s3-plain-be
    mode tcp
    balance source
    server minio-s3 192.168.122.8:9000 check

backend minio-console-plain-be
    mode tcp
    balance source
    server minio-console 192.168.122.8:9001 check


# ─── OpenShift HTTP (port 80) — Host header routing ───
frontend http-ingress
    bind *:80
    mode http
    option httplog
    acl is_acm hdr_end(host) .apps.acm.awezlab.local
    acl is_dubai_ocp hdr_end(host) .apps.dubai-ocp.awezlab.local
    acl is_abudhabi_ocp hdr_end(host) .apps.abudhabi-ocp.awezlab.local
    acl is_hcp1 hdr_end(host) .apps.hcp1.awezlab.local
    acl is_hcp2 hdr_end(host) .apps.hcp2.awezlab.local
    acl is_minio_s3 hdr(host) -i s3.minio.awezlab.local
    acl is_minio_console hdr(host) -i console.minio.awezlab.local
    use_backend http-minio-s3-be if is_minio_s3
    use_backend http-minio-console-be if is_minio_console
    use_backend http-hcp1-be if is_hcp1
    use_backend http-hcp2-be if is_hcp2
    use_backend http-acm-be if is_acm
    use_backend http-dubai-ocp-be if is_dubai_ocp
    use_backend http-abudhabi-ocp-be if is_abudhabi_ocp
    default_backend http-ocpv-be

backend http-ocpv-be
    mode http
    balance source
    server worker1 192.168.150.81:80 check
    server worker2 192.168.150.84:80 check

backend http-acm-be
    mode http
    balance source
    server acm-ingress 192.168.122.253:80 check

backend http-dubai-ocp-be
    mode http
    balance source
    server dubai-ocp-ingress 192.168.122.252:80 check

backend http-abudhabi-ocp-be
    mode http
    balance source
    server abudhabi-ocp-ingress 192.168.122.251:80 check

backend http-hcp1-be
    mode http
    balance source
    server hcp1-ingress 192.168.122.21:80 check

backend http-hcp2-be
    mode http
    balance source
    server hcp2-ingress 192.168.122.22:80 check

backend http-minio-s3-be
    mode http
    balance source
    server minio-s3 192.168.122.8:9000 check

backend http-minio-console-be
    mode http
    balance source
    server minio-console 192.168.122.8:9001 check


# HAProxy Stats
listen stats
    bind *:1936
    mode http
    stats enable
    stats uri /haproxy-stats
    stats refresh 10s
